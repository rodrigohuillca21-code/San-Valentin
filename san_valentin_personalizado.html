3<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi San Valentín? 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
        }

        /* Corazones flotantes de fondo */
        .heart-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(45deg);
            animation: float 10s infinite;
        }

        .heart::before,
        .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .heart::before {
            top: -10px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: -10px;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(45deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(45deg);
                opacity: 0;
            }
        }

        /* Contenedor principal */
        .container {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 10;
        }

        /* SECCIÓN DE FOTOS */
        .photos-section {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .photo-card {
            text-align: center;
        }

        .photo-frame {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            overflow: hidden;
            border: 5px solid #f5576c;
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.3);
            margin: 0 auto 15px;
            position: relative;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 8px 20px rgba(245, 87, 108, 0.3);
            }
            50% {
                box-shadow: 0 8px 30px rgba(245, 87, 108, 0.6);
            }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Placeholder para cuando no hay foto */
        .photo-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        .photo-caption {
            font-size: 0.95rem;
            color: #f5576c;
            font-weight: 600;
            font-style: italic;
            max-width: 180px;
            line-height: 1.4;
        }

        /* Separador decorativo */
        .divider {
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #f5576c, transparent);
            margin: 30px auto;
        }

        .question {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .emoji {
            font-size: 5rem;
            margin: 20px 0;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-yes {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-no {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            position: relative;
        }

        .btn-no:hover {
            transform: scale(0.95);
        }

        /* Pantalla de éxito */
        .success-screen {
            display: none;
            text-align: center;
        }

        .success-screen.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .success-emoji {
            font-size: 8rem;
            margin: 20px 0;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            25% {
                transform: scale(1.2);
            }
            50% {
                transform: scale(1);
            }
        }

        .success-message {
            font-size: 2rem;
            font-weight: bold;
            color: #f5576c;
            margin: 20px 0;
        }

        .success-text {
            font-size: 1.2rem;
            color: #666;
            line-height: 1.6;
        }

        /* Contador de intentos */
        .attempts {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            .photos-section {
                gap: 20px;
            }

            .photo-frame {
                width: 120px;
                height: 120px;
            }

            .photo-caption {
                font-size: 0.85rem;
                max-width: 150px;
            }

            .question {
                font-size: 1.8rem;
            }

            .emoji {
                font-size: 4rem;
            }

            .btn {
                padding: 12px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Corazones flotantes de fondo -->
    <div class="heart-bg" id="heartBg"></div>

    <!-- Contenedor principal -->
    <div class="container">
        <!-- Pantalla de pregunta -->
        <div id="questionScreen">
            
            <!-- SECCIÓN DE FOTOS -->
            <div class="photos-section">
                <!-- Foto 1 (TÚ) -->
                <div class="photo-card">
                    <div class="photo-frame">
                        <!-- CAMBIA "foto1.jpg" por el nombre de TU foto -->
                        <img src="foto1.jpg" alt="Tú" onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder\'>😍</div>'">
                    </div>
                    <p class="photo-caption">
                        Mi persona favorita
                    </p>
                </div>

                <!-- Emoji corazón en el medio -->
                <div style="display: flex; align-items: center; font-size: 3rem; color: #f5576c;">
                    💕
                </div>

                <!-- Foto 2 (ELLA) -->
                <div class="photo-card">
                    <div class="photo-frame">
                        <!-- CAMBIA "foto2.jpg" por el nombre de SU foto -->
                        <img src="foto2.jpg" alt="Ella" onerror="this.parentElement.innerHTML='<div class=\'photo-placeholder\'>😊</div>'">
                    </div>
                    <p class="photo-caption">
                        Mi chica con ansiedad, hermosa
                    </p>
                </div>
            </div>

            <!-- Separador decorativo -->
            <div class="divider"></div>

            <!-- Pregunta principal -->
            <h1 class="question">¿Quieres ser mi San Valentín?</h1>
            <div class="emoji">💖</div>
            
            <div class="buttons">
                <button class="btn btn-yes" id="btnYes">Sí 💕</button>
                <button class="btn btn-no" id="btnNo">No</button>
            </div>

            <div class="attempts" id="attempts"></div>
        </div>

        <!-- Pantalla de éxito -->
        <div class="success-screen" id="successScreen">
            <div class="success-emoji">💖✨🎉</div>
            <h2 class="success-message">¡Sabía que dirías que sí!</h2>
            <p class="success-text">
                ¡Eres increíble! 💕<br>
                Este 14 de febrero será especial gracias a ti 🌹<br><br>
                <!-- CAMBIA este mensaje final -->
                Gracias por existir mi amor ❤️
            </p>
        </div>
    </div>

    <script>
        // Variables
        let attempts = 0;
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const questionScreen = document.getElementById('questionScreen');
        const successScreen = document.getElementById('successScreen');
        const attemptsDiv = document.getElementById('attempts');

        // Frases para el botón No (PUEDES CAMBIAR ESTAS)
        const noMessages = [
            "¿Segura?",
            "¿Segura segura?",
            "Piénsalo bien... 🥺",
            "No seas así 💔",
            "Dale, di que sí 💕",
            "Última oportunidad...",
            "¿De verdad?",
            "Recapacita mi amor...",
            "Venga, di que sí 💖",
            "No me hagas esto 😢"
        ];

        // Crear corazones flotantes
        function createFloatingHearts() {
            const heartBg = document.getElementById('heartBg');
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 10 + 's';
                heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
                heartBg.appendChild(heart);
            }
        }

        // Evento del botón SÍ
        btnYes.addEventListener('click', function() {
            // Confetti effect
            createConfetti();
            
            // Mostrar pantalla de éxito
            setTimeout(() => {
                questionScreen.style.display = 'none';
                successScreen.classList.add('active');
            }, 500);
        });

        // Evento del botón NO
        btnNo.addEventListener('click', function(e) {
            attempts++;
            
            // Cambiar texto del botón
            if (attempts < noMessages.length) {
                btnNo.textContent = noMessages[attempts - 1];
            }
            
            // Hacer el botón No más pequeño y el Sí más grande
            const currentNoSize = parseFloat(window.getComputedStyle(btnNo).fontSize);
            const currentYesSize = parseFloat(window.getComputedStyle(btnYes).fontSize);
            
            btnNo.style.fontSize = (currentNoSize * 0.9) + 'px';
            btnNo.style.padding = (15 * 0.9 ** attempts) + 'px ' + (40 * 0.9 ** attempts) + 'px';
            
            btnYes.style.fontSize = (currentYesSize * 1.1) + 'px';
            btnYes.style.padding = (15 * 1.1 ** attempts) + 'px ' + (40 * 1.1 ** attempts) + 'px';
            
            // Mover el botón No aleatoriamente
            const randomX = Math.random() * 200 - 100;
            const randomY = Math.random() * 200 - 100;
            
            btnNo.style.transform = `translate(${randomX}px, ${randomY}px) scale(${0.9 ** attempts})`;
            
            // Mostrar intentos
            attemptsDiv.textContent = `Intentos de decir "No": ${attempts} 😏`;
            
            // Si intenta muchas veces, desaparecer el botón No
            if (attempts >= 7) {
                btnNo.style.opacity = '0';
                btnNo.style.pointerEvents = 'none';
                attemptsDiv.textContent = 'El botón "No" ya no existe 😊';
            }
        });

        // Función para crear confetti
        function createConfetti() {
            const colors = ['#f093fb', '#f5576c', '#ffd700', '#ff69b4', '#ff1493'];
            for (let i = 0; i < 150; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-10px';
                confetti.style.opacity = '1';
                confetti.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                confetti.style.transition = 'all 3s ease-out';
                confetti.style.zIndex = '1000';
                confetti.style.pointerEvents = 'none';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                
                document.body.appendChild(confetti);
                
                setTimeout(() => {
                    confetti.style.top = window.innerHeight + 'px';
                    confetti.style.left = (parseFloat(confetti.style.left) + (Math.random() * 200 - 100)) + 'px';
                    confetti.style.opacity = '0';
                }, 100);
                
                setTimeout(() => {
                    confetti.remove();
                }, 3100);
            }
        }

        // Inicializar
        createFloatingHearts();

        // Easter egg: Si presionan ESC, también es sí
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                btnYes.click();
            }
        });
    </script>
</body>
</html>
